# Fantasy campaign vocabulary for the tiny-realms ruleset.
event.CampaignCreated=A new campaign begins in the realm of {rulesetId}.
event.FactionAdded={faction} takes the field, led by {name}.
event.LocationAdded=New territory is discovered: {id} ({kind}).
event.LocationOwnerChanged={owner} claims {location}.
event.EntityCreated={owner} musters a {kind} ({id}) at {at}.
event.EntityMoved={entity} marches from {from} to {to}.
event.EntityDestroyed={entity} is destroyed at {at} ({reason}).
event.ResourceChanged={faction}'s treasury changes by {delta} {resource}.
event.IncomeCollected={faction} collects {gold} gold from {locations} territories.
event.OrderStaged={faction} drafts orders: {order}
event.OrderStagedHidden={faction} has drafted sealed orders.
event.OrderRejected={faction}'s orders could not be carried out: {reasons}
event.FactionLockedIn={faction} has sealed its orders (automatic: {automatic}).
event.OrdersResolved=The sealed orders are carried out.
event.PhaseEntered=Turn {turn}: the {phase} phase begins.
event.PendingOpened=A {kind} must be fought between {parties}.
event.OutcomeReported={faction} reports the result of {pending}: {outcome}.
event.OutcomeAdjudicated=The game master rules on {pending}: {outcome}.
event.PendingDisputed=The reports for {pending} disagree; the game master must rule.
event.PendingResolved={pending} is settled in favour of {outcome}.
event.CampaignEnded={winner} has won the campaign!

reason.move.not_found=There is no such unit: {unit}.
reason.move.not_yours={unit} does not serve you.
reason.move.not_mobile={unit} cannot march.
reason.move.empty_path=A march needs a destination.
reason.move.too_far=A warband cannot march more than {max} steps.
reason.move.not_adjacent={from} is not connected to {to}.
reason.recruit.no_such_location=There is no such place: {location}.
reason.recruit.not_keep=You can only muster at a keep you hold ({location}).
reason.recruit.too_poor=Mustering costs {cost} gold.
reason.tile.not_owned=You do not hold {location}.
reason.tile.exists={location} already exists.
reason.tile.bad_terrain={terrain} is not a known terrain.
reason.orders.already_locked=Your orders are already sealed.
reason.command.stale_phase=The campaign has moved on to turn {turn}, {phase}.
reason.command.forbidden=You may not do that.
reason.campaign.ended=The campaign is over.

term.warband=warband
term.castle=castle
term.river=ford
term.forest=wood
term.mountain=mountain
term.hill=hill
term.marsh=marsh
