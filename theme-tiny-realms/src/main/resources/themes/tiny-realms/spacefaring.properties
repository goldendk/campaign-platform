# The same ruleset, dressed as interstellar freight. Only words change; the events are identical.
event.CampaignCreated=Charter {rulesetId} opens for trading.
event.FactionAdded={faction} registers as a carrier, captained by {name}.
event.LocationAdded=Survey report: {id} ({kind}) added to the charts.
event.LocationOwnerChanged={owner} secures a concession at {location}.
event.EntityCreated={owner} commissions a {kind} ({id}) at {at}.
event.EntityMoved={entity} jumps from {from} to {to}.
event.EntityDestroyed={entity} is lost at {at} ({reason}).
event.ResourceChanged={faction}'s ledger changes by {delta} {resource}.
event.IncomeCollected={faction} books {gold} credits from {locations} concessions.
event.OrderStaged={faction} files a flight plan: {order}
event.OrderStagedHidden={faction} has filed a sealed flight plan.
event.OrderRejected={faction}'s flight plan was refused: {reasons}
event.FactionLockedIn={faction} has transmitted its plans (automatic: {automatic}).
event.OrdersResolved=All flight plans execute.
event.PhaseEntered=Cycle {turn}: {phase} window opens.
event.PendingOpened=A {kind} dispute must be settled between {parties}.
event.OutcomeReported={faction} files its report on {pending}: {outcome}.
event.OutcomeAdjudicated=The arbiter rules on {pending}: {outcome}.
event.PendingDisputed=The reports for {pending} conflict; the arbiter must rule.
event.PendingResolved={pending} is settled in favour of {outcome}.
event.CampaignEnded={winner} dominates the trade routes!

reason.move.not_found=No such vessel: {unit}.
reason.move.not_yours={unit} is registered to another carrier.
reason.move.not_mobile={unit} has no drive.
reason.move.empty_path=A flight plan needs a destination.
reason.move.too_far=A freighter cannot jump more than {max} lanes.
reason.move.not_adjacent=No lane joins {from} to {to}.
reason.recruit.no_such_location=No such system: {location}.
reason.recruit.not_keep=Ships can only be commissioned at a shipyard you hold ({location}).
reason.recruit.too_poor=A new hull costs {cost} credits.
reason.tile.not_owned=You hold no concession at {location}.
reason.tile.exists={location} is already charted.
reason.tile.bad_terrain={terrain} is not a known body type.
reason.orders.already_locked=Your plans are already transmitted.
reason.command.stale_phase=The cycle has advanced to {turn}, {phase}.
reason.command.forbidden=You are not authorised.
reason.campaign.ended=The charter has closed.

term.red=Helios Combine
term.blue=Vega Syndicate
